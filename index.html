<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coming Soon</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .coming-soon {
      max-width: 600px;
      padding: 2rem;
    }
    h1 {
      font-weight: bold;
    }
    .countdown {
      font-size: 1.5rem;
      font-weight: 500;
      margin-top: 1.5rem;
    }
    .preview-video {
      width: 100%;
      border-radius: 0.5rem;
      margin-top: 1.5rem;
      box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="coming-soon">
    <h1 class="display-4">⚓ Coming Soon</h1>
    <p class="lead">Our archival and maritime history portal is preparing to launch.</p>
    <hr />
    <p>Stay tuned for restored records, rare documents, and stories from the past relating to Operation Dynamo.</p>

    <!-- Optional countdown placeholder -->
    <div class="countdown text-muted">Launching Spring 2026</div>

    <!-- Contact information -->
    <p class="mt-4">Please get in touch for more information: <a href="mailto:signals@operationdynamo.navy">signals@operationdynamo.navy</a></p>

    <video class="preview-video" controls autoplay loop muted playsinline>
      <source src="Operation_Dynamo_Demo.mov" type="video/quicktime" />
      Your browser does not support the video tag. You can download the video
      <a href="Operation_Dynamo_Demo.mov">here</a>.
    </video>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
